<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Vision - Web Order Form</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom CSS with absolute path to /public -->
    <link rel="stylesheet" href="/public/assets/css/styles.css">
</head>
<body>
    <div class="container py-4">
        <!-- Header -->
        <header class="mb-4">
            <h1 class="display-4">Business Vision</h1>
            <p class="lead">Web Order Form</p>
        </header>

        <!-- Main Order Form -->
        <div class="card mb-4">
            <div class="card-header bg-primary text-white">
                <h2 class="h4 mb-0">Order Details</h2>
            </div>
            <div class="card-body">
                <form id="orderForm">
                    <!-- Customer Information -->
                    <div class="mb-4">
                        <h3 class="h5 mb-3">Customer Information</h3>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="customerName" class="form-label">Customer Name *</label>
                                <input type="text" class="form-control" id="customerName" name="customerName" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="customerEmail" class="form-label">Email *</label>
                                <input type="email" class="form-control" id="customerEmail" name="customerEmail" required>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="customerPhone" class="form-label">Phone</label>
                                <input type="tel" class="form-control" id="customerPhone" name="customerPhone">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="orderDate" class="form-label">Order Date *</label>
                                <input type="date" class="form-control" id="orderDate" name="orderDate" required>
                            </div>
                        </div>
                    </div>

                    <!-- Line Items Section -->
                    <div class="mb-4">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h3 class="h5 mb-0">Line Items</h3>
                            <button type="button" class="btn btn-success btn-sm" id="addLineItem">
                                <i class="bi bi-plus-circle"></i> Add Item
                            </button>
                        </div>
                        <div id="lineItemsContainer">
                            <!-- Line items will be added dynamically -->
                        </div>
                    </div>

                    <!-- Summary Cards -->
                    <div class="row mb-4">
                        <div class="col-md-4">
                            <div class="card">
                                <div class="card-body">
                                    <h5 class="card-title">Subtotal</h5>
                                    <p class="card-text h3" id="subtotalAmount">$0.00</p>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="card">
                                <div class="card-body">
                                    <h5 class="card-title">Tax (10%)</h5>
                                    <p class="card-text h3" id="taxAmount">$0.00</p>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="card bg-primary text-white">
                                <div class="card-body">
                                    <h5 class="card-title">Total</h5>
                                    <p class="card-text h3" id="totalAmount">$0.00</p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Action Buttons -->
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary" id="saveButton">
                            <i class="bi bi-save"></i> Save Order
                        </button>
                        <button type="reset" class="btn btn-secondary" id="resetButton">
                            <i class="bi bi-arrow-counterclockwise"></i> Reset
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Status Messages -->
        <div id="messageContainer"></div>
    </div>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Order Form JS Module with absolute path to /public -->
    <script type="module" src="/public/assets/js/order-form.js"></script>
</body>
</html>
